name: Cross-Platform Qualification

# Cross-platform qualification across the supported runtime boundaries.
# Desktop integration tests invoke the real Memory CLI. Memory requires
# Node >=22.13 and its current SQLite schema requires FTS5, so CI probes that
# capability explicitly rather than failing later with an ambiguous bridge
# error. Node 24.15+ uses the current bundled SQLite build expected by this
# qualification path.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  performance:
    name: Performance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest
        working-directory: Performance
      - name: Run Performance test suite
        run: python -m pytest -q
        working-directory: Performance

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Verify Memory SQLite capability
        run: node -e "const { DatabaseSync } = require('node:sqlite'); const db = new DatabaseSync(':memory:'); db.exec('CREATE VIRTUAL TABLE __fts5_probe USING fts5(x)'); db.close(); console.log('FTS5 available')"
      - name: Install dependencies
        run: npm ci
        working-directory: desktop
      - name: Type-check
        run: npm run typecheck
        working-directory: desktop
      - name: Run desktop test suite
        run: npm test
        working-directory: desktop
