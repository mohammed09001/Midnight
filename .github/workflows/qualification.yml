name: Cross-Platform Qualification

# Cross-platform qualification across the supported runtime boundaries.
# Desktop integration tests invoke the real Memory CLI, so the Node runtime
# must satisfy Memory/package.json (>=22.13.0); using Node 20 made that
# qualification fail before product code ran because --experimental-strip-types
# was unavailable.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  performance:
    name: Performance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest
        working-directory: Performance
      - name: Run Performance test suite
        run: python -m pytest -q
        working-directory: Performance

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install dependencies
        run: npm ci
        working-directory: desktop
      - name: Type-check
        run: npm run typecheck
        working-directory: desktop
      - name: Run desktop test suite
        run: npm test
        working-directory: desktop
